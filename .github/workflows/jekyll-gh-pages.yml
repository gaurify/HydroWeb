name: HydroWeb CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          node --check server.js
          node --check src/main/main.js
          node --check src/main/reminderScheduler.js
          node --check src/main/notifications.js
          node --check src/renderer/js/preload.js
          node --check src/renderer/js/storage.js
          node --check src/renderer/js/appwriteBackend.js
          node --check src/renderer/js/dashboard.js
          node --check src/renderer/js/settings.js
          node --check src/renderer/js/app.js

      - name: Verify web static paths
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -fI http://localhost:3000/
          curl -fI http://localhost:3000/css/styles.css
          curl -fI http://localhost:3000/js/app.js
          curl -fI http://localhost:3000/assets/icon.png
          kill $SERVER_PID
